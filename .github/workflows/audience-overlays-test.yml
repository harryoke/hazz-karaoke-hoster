name: Audience Overlays Test Build

on:
  push:
    branches:
      - test-audience-overlays-slideshow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore HazzKaraokeHoster.sln

      - name: Build solution
        shell: pwsh
        run: dotnet build HazzKaraokeHoster.sln -c Release --no-restore -m:1 --disable-build-servers

      - name: Publish Windows x64 test build
        shell: pwsh
        run: |
          dotnet publish "src/HazzKaraokeHoster.App/HazzKaraokeHoster.App.csproj" `
            -c Release `
            -r win-x64 `
            -m:1 `
            --disable-build-servers `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "publish/HazzKaraokeHoster"

      - name: Verify test publish
        shell: pwsh
        run: |
          $exe = "publish/HazzKaraokeHoster/Hazz Karaoke Hoster.exe"
          if (-not (Test-Path $exe)) { throw "Published EXE not found: $exe" }
          Write-Host "Test EXE:" (Get-Item $exe).Length "bytes"

      - name: Package test build
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/HazzKaraokeHoster/*" -DestinationPath "Hazz_Karaoke_Hoster_Audience_Overlays_TEST_Windows_x64.zip" -CompressionLevel Optimal

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hazz-Karaoke-Hoster-Audience-Overlays-TEST
          path: Hazz_Karaoke_Hoster_Audience_Overlays_TEST_Windows_x64.zip
          if-no-files-found: error
